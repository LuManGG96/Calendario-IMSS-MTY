<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendario médico y viajes</title>
  <style>
    :root{--orange:#ff5600;--neutral:#171717;--muted:#737373;--line:#e5e5e5;--bg:#f5f5f5;--white:#fff}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#171717;padding:16px} .wrap{max-width:1280px;margin:0 auto;display:grid;gap:24px}
    .card{background:white;border:1px solid var(--line);border-radius:28px;box-shadow:0 1px 2px rgba(0,0,0,.04)} .header{padding:28px;display:flex;gap:20px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}.eyebrow{text-transform:uppercase;letter-spacing:.2em;color:#737373;font-size:13px;margin:0 0 8px}.h1{font-size:clamp(30px,5vw,52px);line-height:1.02;margin:0;font-weight:800;letter-spacing:-.04em}.lead{color:#666;margin:14px 0 0;max-width:760px}.controls{display:flex;gap:12px;align-items:center;max-width:100%;flex-wrap:wrap}.monthBtns{display:flex;gap:8px;background:#f5f5f5;border-radius:18px;padding:4px;overflow:auto;max-width:100%}.monthBtns button,.today{border:0;border-radius:13px;padding:10px 16px;font-weight:700;white-space:nowrap;cursor:pointer}.monthBtns button{background:transparent;color:#666}.monthBtns button.active{background:#171717;color:#fff}.today{background:var(--orange);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12)}
    .main{display:grid;grid-template-columns:2fr 1fr;gap:24px}.calendar{padding:20px}.sectionTitle{display:flex;align-items:center;gap:10px;margin:0 0 20px;font-size:26px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.week div{text-align:center;color:#666;font-weight:800;font-size:12px;margin-bottom:8px}.day{min-height:132px;border:1px solid #e5e5e5;border-radius:18px;padding:8px;background:#fff;min-width:0}.empty{background:#fafafa;border-color:#eee}.dayHead{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;margin-bottom:8px}.num{font-weight:800;font-size:14px}.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.badge{font-size:10px;padding:2px 6px;border-radius:999px;border:1px solid transparent}.badge.ho{background:#f0f9ff;border-color:#bae6fd;color:#0369a1}.badge.tent{background:#fffbeb;border-color:#fde68a;color:#92400e}.badge.todayB{background:var(--orange);color:#fff}.badge.adjust{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}.isVacation{box-shadow:0 0 0 2px #a7f3d0 inset}.isTentative{background:#fffbeb80;box-shadow:0 0 0 2px #fde68a inset}.isHO{background:#f0f9ff66}.isChange{box-shadow:0 0 0 2px #bfdbfe inset}.isToday{background:#fff7ed;box-shadow:0 0 0 4px var(--orange) inset}.stack{display:grid;gap:4px;min-width:0;overflow:hidden}
    details{min-width:0} summary{list-style:none;cursor:pointer;border-radius:13px;border:1px solid;padding:5px 8px;overflow:hidden} summary::-webkit-details-marker{display:none}.pillTop{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:800;line-height:1.12;min-width:0}.pillTop span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pillTime{font-size:10px;margin-top:2px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail{margin-top:4px;border:1px solid #e5e5e5;background:#fff;border-radius:12px;padding:6px 8px;font-size:10px;color:#555;box-shadow:0 1px 2px rgba(0,0,0,.04);position:relative;z-index:2}.home{background:#f0f9ff;border-color:#bae6fd;color:#075985}.lab{background:#f5f3ff;border-color:#ddd6fe;color:#5b21b6}.imss{background:#fff1f2;border-color:#fecdd3;color:#9f1239}.medicine{background:#fff7ed;border-color:#fed7aa;color:#7c2d12}.vacation{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.travel{background:#fafaf9;border-color:#d6d3d1;color:#292524}.tentative{background:#fffbeb;border-color:#fde68a;color:#78350f}.change{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}.commission{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}.sidebar{display:grid;gap:24px}.sideCard{padding:20px}.sideCard h3{font-size:22px;margin:0 0 16px}.legend{display:grid;gap:10px}.legendItem{display:flex;align-items:center;gap:10px;border:1px solid;border-radius:18px;padding:10px 12px;font-weight:700}.small{font-size:12px;color:#737373;margin-top:16px}.upcoming{max-height:560px;overflow:auto;padding-right:4px}.upItem{display:flex;gap:8px;border-bottom:1px solid #f0f0f0;padding:0 0 10px;margin-bottom:10px}.upDate{text-transform:uppercase;color:#737373;font-size:12px;font-weight:800;margin:0}.upTitle{font-weight:800;margin:2px 0 0;line-height:1.15}.upTime{font-size:12px;color:#737373;margin:2px 0 0}.detailMonth,.changes,.consider,.stats{padding:22px}.detailMonth h2,.changes h2,.consider h2{font-size:26px;margin:0 0 16px}.cardsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.eventCard{border:1px solid;border-radius:18px;padding:16px}.meta{text-transform:uppercase;letter-spacing:.04em;font-size:12px;font-weight:800;opacity:.7;margin:0}.eventCard h3{margin:6px 0 0;font-size:18px;line-height:1.15}.eventCard p{font-size:14px}.considerGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.consider article{border:1px solid #fde68a;background:#fffbeb;color:#78350f;border-radius:18px;padding:16px}.consider h3{margin:0;font-size:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0;background:transparent;border:0;box-shadow:none}.stat{padding:20px}.stat p:first-child{font-size:14px;color:#737373;margin:0}.stat p:last-child{font-size:42px;font-weight:800;margin:4px 0 0}.mobileHint{display:none}
    @media(max-width:1024px){.main{grid-template-columns:1fr}.cardsGrid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:640px){body{padding:10px}.header{padding:22px}.calendar{padding:12px}.week,.grid{gap:5px}.day{min-height:70px;border-radius:14px;padding:6px}.num{font-size:13px}.badge{font-size:0;width:16px;height:16px;padding:0;border-radius:999px;display:inline-flex;align-items:center;justify-content:center}.badge.ho::after{content:"🏠";font-size:10px}.badge.tent::after{content:"?";font-size:11px;font-weight:900}.badge.todayB::after{content:"•";font-size:16px}.badge.adjust::after{content:"↺";font-size:11px}.pillTop span,.pillTime{display:none}.pillTop{justify-content:center}.pillTop .ico{font-size:13px}.pillTop{gap:0}summary{padding:4px;border-radius:10px;min-height:24px;display:flex;align-items:center;justify-content:center}.detail{position:absolute;left:8px;right:8px;font-size:11px;z-index:20}.cardsGrid,.considerGrid,.stats{grid-template-columns:1fr}.mobileHint{display:block;color:#737373;font-size:12px;margin-top:8px}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const months=[{label:"Abril 2026",year:2026,month:4},{label:"Mayo 2026",year:2026,month:5},{label:"Junio 2026",year:2026,month:6},{label:"Julio 2026",year:2026,month:7},{label:"Agosto 2026",year:2026,month:8},{label:"Septiembre 2026",year:2026,month:9},{label:"Octubre 2026",year:2026,month:10}];
const events=[
{date:"2026-04-20",title:"Inicio home office",time:"",type:"home",note:"Periodo temporal de trabajo en home office."},{date:"2026-04-23",title:"Laboratorio IMSS",time:"7:00",type:"lab",note:"Día tomado como vacaciones por estudios."},{date:"2026-04-23",title:"Vacaciones",time:"",type:"vacation",note:"Día completo."},{date:"2026-04-30",title:"Vacaciones",time:"",type:"vacation",note:"Inicio de vacaciones."},{date:"2026-05-05",title:"Revisión PPD",time:"",type:"imss",note:"Revisión en IMSS."},{date:"2026-05-08",title:"Laboratorio IMSS",time:"7:00",type:"lab",note:"PPD y reposición de muestra."},{date:"2026-05-13",title:"Laboratorio IMSS",time:"7:00",type:"lab",note:"Nueva toma de muestra."},{date:"2026-05-14",title:"Dermatología IMSS",time:"18:00",type:"imss",note:"Con ajuste de horario."},{date:"2026-05-15",title:"Gestión médica",time:"",type:"imss",note:"Análisis y cita médica."},{date:"2026-06-07",title:"Viaje a MTY",time:"",type:"travel",note:"Salida tentativa para estar en Monterrey la semana del resurtido."},{date:"2026-06-08",title:"Laboratorio IMSS",time:"7:00",type:"lab",note:"Análisis programados; no pudieron completarse ese día."},{date:"2026-06-08",title:"Vacaciones",time:"",type:"vacation",note:"Día tomado como vacaciones por visita/análisis."},{date:"2026-06-09",title:"Resurtido medicamento",time:"14:00–18:00",type:"medicine",note:"Puede extenderse una semana si no entregan medicamento."},{date:"2026-06-11",title:"Comisión de trabajo",time:"8:00–10:00",type:"commission",note:"Solicitud por comisión dentro del horario normal de jueves para realizar análisis que no pudieron tomarse el 8 de junio."},{date:"2026-06-13",title:"Dermatología particular",time:"",type:"imss",note:"Resultados de hígado y seguimiento."},{date:"2026-06-14",title:"Regreso",time:"",type:"travel",note:"Regreso tentativo en domingo."},{date:"2026-07-05",title:"Viaje a MTY",time:"",type:"travel",note:"Salida tentativa para resurtido mensual."},{date:"2026-07-07",title:"Resurtido medicamento",time:"14:00–18:00",type:"medicine",note:"Puede extenderse una semana si no entregan medicamento."},{date:"2026-07-10",title:"Ultrasonido",time:"14:00",type:"imss",note:"Ultrasonido."},{date:"2026-07-12",title:"Regreso",time:"",type:"travel",note:"Regreso tentativo en domingo."},{date:"2026-07-13",title:"Vacaciones",time:"",type:"vacation",note:"Día de vacaciones."},{date:"2026-07-14",title:"Vacaciones",time:"",type:"vacation",note:"Día de vacaciones."},{date:"2026-07-15",title:"Vacaciones",time:"",type:"vacation",note:"Día de vacaciones."},{date:"2026-07-16",title:"Vacaciones",time:"",type:"vacation",note:"Día de vacaciones."},{date:"2026-07-17",title:"Vacaciones",time:"",type:"vacation",note:"Día de vacaciones."},{date:"2026-08-09",title:"Viaje a MTY",time:"",type:"travel",note:"Salida tentativa para resurtido mensual, movida una semana después."},{date:"2026-08-11",title:"Resurtido medicamento",time:"14:00–18:00",type:"medicine",note:"Puede extenderse una semana si no entregan medicamento."},{date:"2026-08-16",title:"Regreso",time:"",type:"travel",note:"Regreso tentativo en domingo."},{date:"2026-08-17",title:"Tentativo HO/vacaciones",time:"17–21 ago",type:"tentative",note:"Rango tentativo: posible vacaciones u home office para no regresar y volver a viajar una semana después. No confirmado."},{date:"2026-08-23",title:"Viaje a MTY",time:"",type:"travel",note:"Salida tentativa para laboratorios, resurtido y cita de septiembre."},{date:"2026-08-24",title:"Laboratorio IMSS",time:"7:00",type:"lab",note:"Previo a consulta de septiembre."},{date:"2026-09-01",title:"Resurtido medicamento",time:"14:00–18:00",type:"medicine",note:"Puede extenderse una semana si no entregan medicamento."},{date:"2026-09-03",title:"Dermatología IMSS",time:"18:00",type:"imss",note:"Consulta dermatología IMSS."},{date:"2026-09-06",title:"Regreso",time:"",type:"travel",note:"Regreso tentativo en domingo."},{date:"2026-10-04",title:"Viaje a MTY",time:"",type:"travel",note:"Salida tentativa para resurtido mensual y tomografía."},{date:"2026-10-06",title:"Resurtido medicamento",time:"14:00–18:00",type:"medicine",note:"Puede extenderse una semana si no entregan medicamento."},{date:"2026-10-09",title:"Tomografía tórax",time:"15:30",type:"imss",note:"Tomografía de tórax."},{date:"2026-10-11",title:"Regreso",time:"",type:"travel",note:"Regreso tentativo en domingo."}];
const scheduleChanges={"2026-05-14":{label:"Cambio de horario",adjusted:"8:00–13:30 · 14:00–17:00",reason:"Horario corrido por cita de dermatología IMSS."},"2026-05-15":{label:"Cambio de horario",adjusted:"7:30–12:30 · 15:30–19:00",reason:"Gestión médica y dermatología particular."}};
const homeOfficeRanges=[{start:"2026-04-20",end:"2026-05-15"},{start:"2026-06-09",end:"2026-06-12"},{start:"2026-07-06",end:"2026-07-10"},{start:"2026-08-10",end:"2026-08-14"},{start:"2026-08-24",end:"2026-09-04"},{start:"2026-10-05",end:"2026-10-09"}];
const config={home:["Home office","🏠","home"],lab:["Laboratorio","🧪","lab"],imss:["Consulta","🩺","imss"],medicine:["Medicamento","💊","medicine"],vacation:["Vacaciones","✈️","vacation"],travel:["Viaje / regreso","🚗","travel"],tentative:["Tentativo","?","tentative"],commission:["Comisión","📄","commission"]};
const compact={"Laboratorio IMSS":"Labs IMSS","Dermatología particular":"Derma part.","Dermatología IMSS":"Derma IMSS","Resurtido medicamento":"Medicamento","Tomografía tórax":"Tomo tórax","Inicio home office":"Inicio HO","Gestión médica":"Gestión","Viaje a MTY":"Viaje MTY","Tentativo HO/vacaciones":"Tentativo","Comisión de trabajo":"Comisión"};
function getTodayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateKey(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function getMonthDays(y,m){const first=new Date(y,m-1,1),last=new Date(y,m,0),offset=(first.getDay()+6)%7,days=[];for(let i=0;i<offset;i++)days.push(null);for(let d=1;d<=last.getDate();d++)days.push(d);while(days.length%7!==0)days.push(null);return days}
function isWeekend(key){const day=new Date(`${key}T12:00:00`).getDay();return day===0||day===6} function isVacationDay(key){return !!(key&&((key>="2026-04-30"&&key<="2026-05-08")||key==="2026-04-23"||key==="2026-06-08"||(key>="2026-07-13"&&key<="2026-07-17")))} function isTentativeDay(key){return !!(key&&key>="2026-08-17"&&key<="2026-08-21"&&!isWeekend(key))} function isHomeOfficeDay(key){return !!(key&&!isWeekend(key)&&homeOfficeRanges.some(r=>key>=r.start&&key<=r.end))}
function dayName(k){return new Date(`${k}T12:00:00`).toLocaleDateString('es-MX',{weekday:'long'})} function formatDate(k){return new Date(`${k}T12:00:00`).toLocaleDateString('es-MX',{day:'numeric',month:'long'})} function monthIndexFor(k){const [y,m]=k.split('-').map(Number);const i=months.findIndex(x=>x.year===y&&x.month===m);return i>=0?i:0}
const byDate=events.reduce((a,e)=>((a[e.date] ||= []).push(e),a),{});let selected=monthIndexFor(getTodayKey());
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function eventPill(e){let c=config[e.type]||config.imss;return `<details><summary class="${c[2]}"><div class="pillTop"><span class="ico">${c[1]}</span><span>${esc(compact[e.title]||e.title)}</span></div>${e.time?`<div class="pillTime">${esc(e.time)}</div>`:''}</summary><div class="detail"><strong>${esc(e.title)}</strong>${e.time?' · '+esc(e.time):''}<br>${esc(e.note)}</div></details>`}
function render(){const today=getTodayKey(),m=months[selected];const visible=events.filter(e=>{const [y,mo]=e.date.split('-').map(Number);return y===m.year&&mo===m.month});const changes=Object.entries(scheduleChanges).filter(([d])=>{const [y,mo]=d.split('-').map(Number);return y===m.year&&mo===m.month}).sort();const upcoming=events.filter(e=>e.date>='2026-06-01'&&e.type!=='travel').sort((a,b)=>a.date.localeCompare(b.date));
let daysHtml=getMonthDays(m.year,m.month).map((d,i)=>{if(!d)return `<div class="day empty"></div>`;const key=dateKey(m.year,m.month,d),ev=byDate[key]||[],change=scheduleChanges[key],vac=isVacationDay(key),tent=isTentativeDay(key),ho=isHomeOfficeDay(key),ist=key===today;return `<div class="day ${vac?'isVacation':''} ${tent?'isTentative':''} ${ho?'isHO':''} ${change?'isChange':''} ${ist?'isToday':''}"><div class="dayHead"><span class="num">${d}</span><div class="badges">${ho?'<span class="badge ho">HO</span>':''}${tent?'<span class="badge tent">Tent.</span>':''}${ist?'<span class="badge todayB">Hoy</span>':''}${change?'<span class="badge adjust">Ajuste</span>':''}</div></div>${change?`<details><summary class="change"><div class="pillTop"><span>${esc(change.label)}</span></div><div class="pillTime">${esc(change.adjusted)}</div></summary><div class="detail">${esc(change.reason)}</div></details>`:''}<div class="stack">${ev.map(eventPill).join('')}</div></div>`}).join('');
let app=`<div class="wrap"><header class="card header"><div><p class="eyebrow">Registro personal</p><h1 class="h1">Calendario médico y viajes</h1><p class="lead">Vista resumida para marcar consultas, laboratorios, medicamento, viajes tentativos, regresos y home office relacionado.</p></div><div class="controls"><div class="monthBtns">${months.map((x,i)=>`<button class="${i===selected?'active':''}" onclick="selected=${i};render()">${x.label.replace(' 2026','')}</button>`).join('')}</div><button class="today" onclick="selected=monthIndexFor(getTodayKey());render()">Hoy</button></div></header><section class="main"><div class="card calendar"><h2 class="sectionTitle">📅 ${m.label}</h2><div class="week">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div>${x}</div>`).join('')}</div><div class="grid">${daysHtml}</div><p class="mobileHint">En móvil, toca los íconos dentro de cada fecha para ver detalles.</p></div><aside class="sidebar"><div class="card sideCard"><h3>Leyenda</h3><div class="legend">${Object.entries(config).map(([k,c])=>`<div class="legendItem ${c[2]}">${c[1]} <span>${c[0]}</span></div>`).join('')}</div><p class="small">Las etiquetas se pueden abrir con click para ver detalles.</p></div><div class="card sideCard"><h3>🕒 Próximos pendientes</h3><div class="upcoming">${upcoming.map(e=>`<div class="upItem"><span>${(config[e.type]||config.imss)[1]}</span><div><p class="upDate">${formatDate(e.date)}</p><p class="upTitle">${esc(e.title)}</p>${e.time?`<p class="upTime">${esc(e.time)}</p>`:''}</div></div>`).join('')}</div></div></aside></section><section class="card detailMonth"><h2>Detalle del mes seleccionado</h2>${visible.length?`<div class="cardsGrid">${visible.map(e=>{let c=config[e.type]||config.imss;return `<article class="eventCard ${c[2]}"><p class="meta">${dayName(e.date)} · ${formatDate(e.date)}</p><h3>${c[1]} ${esc(e.title)}</h3>${e.time?`<p><strong>${esc(e.time)}</strong></p>`:''}<p>${esc(e.note)}</p></article>`}).join('')}</div>`:'<p style="color:#737373">No hay eventos registrados en este mes.</p>'}</section>${changes.length?`<section class="card changes"><h2>Cambios de horario confirmados</h2><div class="cardsGrid">${changes.map(([d,ch])=>`<article class="eventCard change"><p class="meta">${dayName(d)} · ${formatDate(d)}</p><h3>${esc(ch.label)}</h3><p><strong>Horario:</strong> ${esc(ch.adjusted)}</p><p>${esc(ch.reason)}</p></article>`).join('')}</div></section>`:''}<section class="card consider"><h2>Detalles a considerar</h2><div class="considerGrid"><article><h3>Resurtimiento de medicamento</h3><p>El resurtimiento puede variar y extenderse a otra semana si no tienen medicamento disponible.</p></article><article><h3>Horario de recolección</h3><p>El horario 14:00–18:00 es una ventana disponible para recogerlo; no significa que el trámite tarde todo ese tiempo.</p></article></div></section><section class="stats"><div class="card stat"><p>Cambios confirmados</p><p>${Object.keys(scheduleChanges).length}</p></div><div class="card stat"><p>Eventos registrados</p><p>${events.length}</p></div><div class="card stat"><p>Meses visibles</p><p>${months.length}</p></div></section></div>`;document.getElementById('app').innerHTML=app}
render();
</script>
</body>
</html>
